name: CI & Security Invariant Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security & Dependency Audit
        run: |
          npm audit
          npm run audit:claims

      - name: TypeScript Typecheck
        run: npm run build

      - name: Unit Tests
        run: npm run test:unit
